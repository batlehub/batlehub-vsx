from_latest_tag = true
ignore_merge_commits = false
disable_changelog = false
disable_bump_commit = false
generate_mono_repository_global_tag = true
generate_mono_repository_package_tags = true
branch_whitelist = []
skip_ci = "[skip ci]"
skip_untracked = false
post_bump_hooks = []
post_package_bump_hooks = []
tag_prefix = "v"

# Each extension is a package of its own: it carries its own version, its own
# changelog and its own tag (`<name>-vX.Y.Z`), so a fix in one never republishes
# the other to Open VSX and the Marketplace. `cog bump --auto` bumps every
# package a commit touched and adds the global `vX.Y.Z` tag on top; the release
# workflow ignores that one and keys off the package tags.
#
# A package's own `pre_bump_hooks` run with the working directory set to its
# `path`, which is why these need no `-C`. The tag is the release and the
# number inside the VSIX has to be the number on the tag: the release workflow
# refuses a mismatch. Cog stages whatever its pre-bump hooks touch, so the bump
# commit carries the new package.json. `pkg set`, not `pnpm version`: cog writes
# the changelog before it runs these, so the tree is never clean and
# `pnpm version` refuses to run on it.
#
# A third extension joins the release by gaining a block here. Nothing else in
# the pipeline names an extension.
[monorepo.packages.batlehub-vsx]
path = "extensions/batlehub-vsx"
public_api = true
pre_bump_hooks = ["pnpm pkg set version={{version}}"]

[monorepo.packages.che-remote-ssh]
path = "extensions/che-remote-ssh"
public_api = true
pre_bump_hooks = ["pnpm pkg set version={{version}}"]


[git_hooks]

[git_hooks.commit-msg]
script = """#!/bin/sh
set -e
cog verify --file "$1"
"""

[git_hooks.pre-commit]
script = """#!/bin/sh
set -e
task recu
git add -u # in case recu needed to regenerate files, add need to be done before linting (-u: tracked files only)
task lint
git add -u # in case linting fixed anything
.hooks/end-of-line.sh
.hooks/whitespace-fixer.sh
gitleaks git --pre-commit --redact --staged --verbose
"""

[commit_types]
release = { changelog_title = "Releases" }

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
repository = "batlehub-vsx"
owner = "batleforc"

[bump_profiles]
