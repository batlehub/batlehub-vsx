from_latest_tag = true
ignore_merge_commits = false
disable_changelog = false
disable_bump_commit = false
generate_mono_repository_global_tag = true
branch_whitelist = []
skip_ci = "[skip ci]"
skip_untracked = false
post_bump_hooks = []
post_package_bump_hooks = []
tag_prefix = "v"

# The tag is the release, and the number inside the VSIX has to be the number
# on the tag: the release workflow refuses a mismatch. Cog stages whatever its
# pre-bump hooks touch, so the bump commit carries the new package.json.
# `pkg set`, not `pnpm version`: cog writes CHANGELOG.md before it runs these,
# so the tree is never clean and `pnpm version` refuses to run on it.
pre_bump_hooks = [
  "pnpm -C extensions/batlehub-vsx pkg set version={{version}}",
]


[git_hooks]

[git_hooks.commit-msg]
script = """#!/bin/sh
set -e
cog verify --file "$1"
"""

[git_hooks.pre-commit]
script = """#!/bin/sh
set -e
task recu
git add -u # in case recu needed to regenerate files, add need to be done before linting (-u: tracked files only)
task lint
git add -u # in case linting fixed anything
.hooks/end-of-line.sh
.hooks/whitespace-fixer.sh
gitleaks git --pre-commit --redact --staged --verbose
"""

[commit_types]
release = { changelog_title = "Releases" }

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
repository = "batlehub-vsx"
owner = "batleforc"

[bump_profiles]
