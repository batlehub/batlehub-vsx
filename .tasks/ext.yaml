version: "3"

# The extensions under extensions/*, driven through pnpm's workspace filter
# so a second extension joins these tasks by existing.
tasks:
  build:
    desc: "Bundle every extension into its dist/extension.js"
    cmds:
      - pnpm -r --filter './extensions/*' run build

  watch:
    desc: "Rebuild batlehub-vsx on every change"
    dir: extensions/batlehub-vsx
    cmds:
      - pnpm run watch

  lint:
    desc: "Type-check, oxlint and prettier --check every extension, packages/java-rules and engine/"
    cmds:
      - pnpm -r --filter './extensions/*' --filter './packages/*' --filter './engine' run typecheck
      - pnpm -r --filter './extensions/*' --filter './packages/*' --filter './engine' run lint

  fix:
    desc: "Format the sources of every extension, packages/java-rules and engine/"
    cmds:
      - pnpm -r --filter './extensions/*' --filter './packages/*' --filter './engine' run format

  test:
    desc: "Unit tests (vitest) of every extension"
    cmds:
      - pnpm -r --filter './extensions/*' --filter './engine' run test

  coverage:
    desc: "Unit tests with coverage, HTML report under extensions/<name>/coverage/"
    cmds:
      - pnpm -r --filter './extensions/*' exec vitest run --coverage

  package:
    desc: "Build and package every extension as a .vsix (extensions/<name>/<name>.vsix)"
    cmds:
      - pnpm -r --filter './extensions/*' run package

  host:
    desc: "Layer 2 of RFC 0001 §10: java-core in a real extension host (@vscode/test-cli; needs a display — CI, or xvfb-run)"
    dir: extensions/java-core
    cmds:
      - pnpm run test:host

  settings:check:
    desc: "Fail when a batlehub.java.* setting is in package.json but not in docs/guide/java/settings.md, or the reverse (RFC 0001 §13 lint)"
    cmds:
      - node scripts/check-settings-doc.mjs

  schema:check:
    desc: "Fail when a generated schema file has drifted: the profile schema from the JDT bundle's rules (RFC 0005 §6.4), and project.json's key table from its schema (RFC 0006 §6.1); each script regenerates its file"
    cmds:
      - node scripts/inspections-schema.mjs --check
      - node scripts/project-schema-walker.mjs --check

  l10n:check:
    desc: "Fail on a user-visible string that bypasses package.nls.json or vscode.l10n.t (RFC 0001 §13 lint)"
    cmds:
      - node scripts/check-l10n.mjs

  licenses:
    desc: "Write THIRD-PARTY.md per extension: every bundled dependency and its licence (decision 22)"
    cmds:
      - node scripts/third-party.mjs
