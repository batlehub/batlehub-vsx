schemaVersion: 2.3.0
metadata:
  name: batlehub-vsx
# The parent carries the tools container and the browser sidecar — headed
# Chrome behind Xvfb, its DevTools port on localhost:9222 from the tools
# container, noVNC to watch it. That browser is the "desktop" of this
# workspace: tests/heavy/view.sh starts a real VS Code web build on a
# loopback port and drives its workbench in that Chrome over CDP, so the
# extension is validated in a real editor without anything of it leaving
# the pod. Chrome is parked at rest (NO_START=true in the parent);
# `task browser:start` launches it before a run.
parent:
  uri: https://raw.githubusercontent.com/batleforc/WeeboDevImage/refs/heads/main/che-browser/devfile.yaml
  components:
    - name: tools
      container:
        endpoints:
          # The docs site (`task docs:dev`).
          - name: docs
            targetPort: 5173
            exposure: public
            protocol: https
            secure: true
          # The dev BatleHub of `task hub:up`: its console, and the registry
          # an editor is pointed at.
          - name: hub
            targetPort: 8080
            exposure: public
            protocol: https
            secure: true

components:
  # Postgres for the BatleHub servers this workspace runs — the dev one of
  # `task hub:up` and the one each heavy run starts on 8124. The servers
  # themselves run in the tools container (a release binary from
  # `task hub:install`, or `cargo run` from a BatleHub checkout beside this
  # one): the published image is distroless and cannot wait for this
  # database to be ready, and a sidecar that exits gets the pod replaced.
  #
  #   DATABASE_URL=postgresql://batlehub:changeme@127.0.0.1:5432/batlehub
  - name: postgres
    container:
      image: postgres:17-alpine
      memoryLimit: 512Mi
      memoryRequest: 128Mi
      env:
        - name: POSTGRES_DB
          value: batlehub
        - name: POSTGRES_PASSWORD
          value: changeme
        - name: POSTGRES_USER
          value: batlehub
        - name: PGDATA
          value: /data/pgdata
      endpoints:
        - name: port-5432
          targetPort: 5432
          exposure: internal
      volumeMounts:
        - name: postgres-data
          path: /data/
  - name: postgres-data
    volume:
      size: 5Gi
