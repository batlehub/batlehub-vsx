version: "3"

# `Taskfile.yaml` is the includes and the tasks every project of this
# template has; the domain tasks live in `.tasks/<domain>.yaml` and keep
# their prefix (`task ext:build`, `task docs:dev`, `task heavy:view`).
includes:
  mise: ./.tasks/mise.yaml
  claude: ./.tasks/claude.yaml
  template: ./.tasks/template.yaml
  ext: ./.tasks/ext.yaml
  docs: ./.tasks/docs.yaml
  heavy: ./.tasks/heavy.yaml
  hub: ./.tasks/hub.yaml
  browser: ./.tasks/browser.yaml

vars:
  # The kubectl hop into the browser sidecar (see .tasks/browser.yaml). Both
  # env vars are exported into every Che workspace container; the `:+` guard
  # keeps the expression valid outside one.
  BROWSER_EXEC: kubectl exec ${DEVWORKSPACE_NAMESPACE:+-n ${DEVWORKSPACE_NAMESPACE}} ${HOSTNAME} -c browser --
  BROWSER_LOGS: kubectl logs ${DEVWORKSPACE_NAMESPACE:+-n ${DEVWORKSPACE_NAMESPACE}} ${HOSTNAME} -c browser

tasks:
  init:
    desc: "Init folder: tools, the Claude skills, the git hooks, the JS dependencies"
    cmds:
      - task mise:install
      - task claude:install
      - cog install-hook -a -o
      - pnpm install --frozen-lockfile

  recu:
    desc: "Recurring job: build every extension so dist/ is what the tests and the package see"
    cmds:
      - task ext:build

  lint:
    desc: "Type-check, lint and format-check every extension"
    cmds:
      - task ext:lint

  test:
    desc: "Unit tests of every extension"
    cmds:
      - task ext:test

  audit:
    desc: "Check the JS dependencies for known vulnerabilities"
    cmds:
      - pnpm audit --audit-level high

  check:
    desc: "Everything CI runs: lint, unit tests, build, package, docs build"
    cmds:
      - task lint
      - task test
      - task ext:package
      - task docs:build
