sonar.organization=batleforc
sonar.projectKey=batleforc_batlehub-vsx
sonar.projectName=batlehub-vsx

# The whole tree, split into sources and tests by pattern: the extensions keep
# their tests beside their sources (`extensions/<name>/test/`), so two directory
# roots cannot separate them. Each test pattern is also excluded from the
# sources, or the scanner refuses to index a file twice.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/test/**,**/test-host/**,**/*.test.ts,jdt/*/src/test/**,tests/**
sonar.exclusions=**/test/**,**/test-host/**,**/*.test.ts,jdt/*/src/test/**,tests/**,\
  **/node_modules/**,**/dist/**,**/coverage/**,**/*.vsix,\
  jdt/*/target/**,docs/.vitepress/cache/**,docs/.vitepress/dist/**,\
  graphify-out/**,.agents/**,.claude/**
# The heavy suite's fixtures are sample projects a language server is pointed
# at — Maven, Gradle, Kotlin, Groovy, Quarkus, Spring. Findings in them are
# findings in somebody's example code, and they have no binaries to analyse.
sonar.test.exclusions=tests/heavy/fixtures/**

# The JDT bundle is compiled by the `check` job before the scan runs (`mvn
# package` compiles both trees); the Java analyser refuses Java sources without
# their classes.
sonar.java.binaries=jdt/batlehub-jdt-core/target/classes
sonar.java.test.binaries=jdt/batlehub-jdt-core/target/test-classes
# The pinned redhat.java jars `jdt/deps.sh` installs into ~/.m2, and JUnit: the
# types the bundle compiles against, without which most of its imports are
# unresolved and the Java rules see half the code.
sonar.java.libraries=${env.HOME}/.m2/repository/batlehub/jdtls/**/*.jar
sonar.java.test.libraries=${env.HOME}/.m2/repository/batlehub/jdtls/**/*.jar,${env.HOME}/.m2/repository/org/junit/**/*.jar,${env.HOME}/.m2/repository/org/opentest4j/**/*.jar
sonar.java.source=21

# One file, merged by the `check` job from each package's vitest run with its
# `SF:` paths rewritten from package-relative to repository-relative.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
